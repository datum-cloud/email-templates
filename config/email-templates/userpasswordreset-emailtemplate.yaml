  textBody: |
    ----------------------------------------
    
    Hi {{.UserName}},
    
    We just received a request to reset the password for your Datum Account.
    
    Reset password {{.ActionUrl}}
    
    Or, copy and paste this link into your browser: {{.ActionUrl}}
    
    If you'd rather use a code, just enter:
    
    {{.Code}}
    
    The link and code will expire in {{.ExpiryMinutes}} minutes.
    
    If you didn't request this reset, please log into your account https://cloud.datum.net/ and secure it now.
    
    ----------------------------------------
    
    Learn more about how Datum is connecting infrastructure for AI at datum.net https://datum.net
    
    Terms of Service https://www.datum.net/legal/terms   |   Privacy Policy https://www.datum.net/legal/privacy   |   Acceptable Use Policy https://www.datum.net/legal/aup
    
    Datum Technology Inc.
    120 Broadway, 26th Floor
    New York, NY 10271

  variables:
  - name: "UserName"
    required: true
    type: "string"
  - name: "Code"
    required: true
    type: "string"
  - name: "ActionUrl"
    required: true
    type: "string"
  - name: "ExpiryMinutes"
    required: true
    type: "string"
