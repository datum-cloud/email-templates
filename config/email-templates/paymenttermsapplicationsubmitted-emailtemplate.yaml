apiVersion: notification.miloapis.com/v1alpha1
kind: EmailTemplate
metadata:
  name: emailtemplates.notification.miloapis.com-paymenttermsapplicationsubmittedemailtemplate
spec:
  subject: "New payment terms application: {{.OrganizationName}}"
  htmlBody: |
    <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
    <html dir="ltr" lang="en">
      <head>
        <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
        <meta name="x-apple-disable-message-reformatting" />
        <title>A new application for payment terms is waiting for review</title>
      </head>
      <body dir="ltr" lang="en">
        <!--$--><!--html--><!--head-->
        <div
          style="display:none;overflow:hidden;line-height:1px;opacity:0;max-height:0;max-width:0"
          data-skip-in-text="true">
          A new application for payment terms is waiting for review
          <div>
             ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿ ‌​‍﻿
          </div>
        </div>
        <!--body-->
        <table
          border="0"
          width="100%"
          cellpadding="0"
          cellspacing="0"
          role="presentation"
          align="center">
          <tbody>
            <tr>
              <td dir="ltr" lang="en">
                <p
                  style="font-size:14px;line-height:24px;margin-top:16px;margin-bottom:16px">
                  A customer has applied for payment terms for the
                  <!-- -->{{.OrganizationName}}<!-- -->
                  organization.
                </p>
                <p
                  style="font-size:14px;line-height:24px;margin:0;margin-top:0;margin-bottom:0;margin-left:0;margin-right:0">
                  Legal name<!-- -->:
                  <!-- -->{{.LegalName}}
                </p>
                <p
                  style="font-size:14px;line-height:24px;margin:0;margin-top:0;margin-bottom:0;margin-left:0;margin-right:0">
                  Applicant<!-- -->:
                  <!-- -->{{.ApplicantEmail}}
                </p>
                <p
                  style="font-size:14px;line-height:24px;margin:0;margin-top:0;margin-bottom:0;margin-left:0;margin-right:0">
                  Asked for<!-- -->:
                  <!-- -->{{.PaymentOption}}
                </p>
                <p
                  style="font-size:14px;line-height:24px;margin:0;margin-top:0;margin-bottom:0;margin-left:0;margin-right:0">
                  Estimated monthly spend<!-- -->:
                  <!-- -->{{.EstimatedMonthlySpend}}
                </p>
                <p
                  style="font-size:14px;line-height:24px;margin-bottom:0;margin-top:16px">
                  Their situation<!-- -->:
                </p>
                <p
                  style="font-size:14px;line-height:24px;margin-top:0;white-space:pre-line;margin-bottom:16px">
                  {{.Situation}}
                </p>
                <p
                  style="font-size:14px;line-height:24px;margin-top:16px;margin-bottom:16px">
                  Review the application<!-- -->:
                  <a
                    href="{{.ReviewUrl}}"
                    style="color:#067df7;text-decoration-line:none"
                    target="_blank"
                    >{{.ReviewUrl}}</a
                  >
                </p>
                <p
                  style="font-size:14px;line-height:24px;margin-top:16px;margin-bottom:16px">
                  Replies to this email don&#x27;t reach the customer. To contact
                  them, email<!-- -->
                  <!-- -->{{.ApplicantEmail}}<!-- -->
                  <!-- -->directly.
                </p>
              </td>
            </tr>
          </tbody>
        </table>
        <!--/$-->
      </body>
    </html>
    

  textBody: |
    A customer has applied for payment terms for the {{.OrganizationName}} organization.
    
    Legal name: {{.LegalName}}
    
    Applicant: {{.ApplicantEmail}}
    
    Asked for: {{.PaymentOption}}
    
    Estimated monthly spend: {{.EstimatedMonthlySpend}}
    
    Their situation:
    
    {{.Situation}}
    
    Review the application: {{.ReviewUrl}}
    
    Replies to this email don't reach the customer. To contact them, email {{.ApplicantEmail}} directly.

  variables:
  - name: "OrganizationName"
    required: true
    type: "string"
  - name: "LegalName"
    required: true
    type: "string"
  - name: "ApplicantEmail"
    required: true
    type: "string"
  - name: "PaymentOption"
    required: true
    type: "string"
  - name: "EstimatedMonthlySpend"
    required: true
    type: "string"
  - name: "Situation"
    required: true
    type: "string"
  - name: "ReviewUrl"
    required: true
    type: "string"
