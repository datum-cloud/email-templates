  textBody: |
    ----------------------------------------
    
    Hi {{.UserName}},
    
    Good news: your application has been approved, so {{.OrganizationName}} can pay by invoice.
    
    Your payment terms start on {{.StartDate}}. From then on, we'll email you each invoice, due {{.NetDays}} days after the invoice date.
    
    You can see your payment terms and change where invoices are sent in billing settings.
    
    Go to Datum Cloud {{.ActionUrl}}
    
    Questions about your terms? Just reach out to support@datum.net and we'll help.
    
    Many thanks,
    
    The Team at Datum
    
    ----------------------------------------
    
    Learn more about how Datum is connecting infrastructure for AI at datum.net https://datum.net
    
    Terms of Service https://www.datum.net/legal/terms   |   Privacy Policy https://www.datum.net/legal/privacy   |   Acceptable Use Policy https://www.datum.net/legal/aup
    
    Datum Technology Inc.
    120 Broadway, 26th Floor
    New York, NY 10271

