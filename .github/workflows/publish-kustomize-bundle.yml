name: Publish Kustomize Bundle

on:
  push:
    branches:
      - main
      - '**'
    paths:
      - 'config/email-templates/**'
  release:
    types:
      - published

jobs:
  publish-kustomize-bundle:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@95a63f871b9cd1f2b4c0224f4a23291beeeb5ef3 # v1.26.0
    with:
      bundle-name: ghcr.io/datum-cloud/email-templates-kustomize
      bundle-path: config/email-templates
    secrets: inherit
