name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: datum-cloud/actions/.github/workflows/ci-basic.yaml@51f5aaf27abc090bdfd70c0a96d37aeb90273c9f # v1.31.0
    with:
      node-version: "26"
      skip: build
      run: |
        pnpm export:custom
        scripts/push-signed-commits.test
        scripts/publish-claude.test
